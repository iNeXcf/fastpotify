name: Keep Fastpotify+ current

on:
  schedule:
    # GitHub cannot subscribe to another repository's pushes, so poll hourly.
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebase-fastpotify-plus
  cancel-in-progress: false

env:
  PATCH_BRANCH: fastpotify-plus
  UPSTREAM_REPOSITORY: crmne/fastpotify
  UPSTREAM_BRANCH: main
  CARGO_TERM_COLOR: always

jobs:
  rebase:
    name: Rebase and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the patch branch
        run: |
          set -euo pipefail
          git clone --branch "$PATCH_BRANCH" --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"

      - name: Rebase onto upstream
        id: rebase
        run: |
          set -euo pipefail
          old_head="$(git rev-parse HEAD)"
          git fetch upstream "$UPSTREAM_BRANCH"
          upstream_head="$(git rev-parse FETCH_HEAD)"

          if git merge-base --is-ancestor "$upstream_head" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git rebase "$upstream_head"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "old_head=$old_head" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.rebase.outputs.changed == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install Linux build dependencies
        if: steps.rebase.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Cache Rust build files
        if: steps.rebase.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fastpotify-plus-rebase

      - name: Verify the rebased branch
        if: steps.rebase.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --all-targets --no-default-features

      - name: Update the patch branch
        if: steps.rebase.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_HEAD: ${{ steps.rebase.outputs.old_head }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push \
            --force-with-lease="refs/heads/${PATCH_BRANCH}:${OLD_HEAD}" \
            origin "HEAD:refs/heads/${PATCH_BRANCH}"

      - name: Calculate the package version
        id: package
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$crate_version"
          crate_version="${crate_version/-/}"
          package_version="${crate_version}.r$(git rev-list --count HEAD).$(git rev-parse --short=7 HEAD)"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Publish the package version
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          main_dir="${RUNNER_TEMP}/fork-main"
          package_dir="packaging/arch/fastpotify-plus-git"
          git fetch origin main
          git worktree add --detach "$main_dir" FETCH_HEAD

          current_version="$(sed -n 's/^pkgver=//p' "$main_dir/$package_dir/PKGBUILD")"
          if [[ "$current_version" == "$PACKAGE_VERSION" ]]; then
            exit 0
          fi

          sed -i "s/^pkgver=.*/pkgver=${PACKAGE_VERSION}/;s/^pkgrel=.*/pkgrel=1/" \
            "$main_dir/$package_dir/PKGBUILD"
          sed -i \
            "s/^[[:space:]]*pkgver = .*/\tpkgver = ${PACKAGE_VERSION}/;s/^[[:space:]]*pkgrel = .*/\tpkgrel = 1/" \
            "$main_dir/$package_dir/.SRCINFO"

          git -C "$main_dir" config user.name "github-actions[bot]"
          git -C "$main_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$main_dir" add \
            "$package_dir/PKGBUILD" "$package_dir/.SRCINFO"
          git -C "$main_dir" commit -m "Track Fastpotify+ ${PACKAGE_VERSION}"
          gh auth setup-git
          git -C "$main_dir" push origin HEAD:refs/heads/main
