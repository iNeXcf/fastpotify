name: Keep Fastpotify+ current

on:
  schedule:
    # GitHub cannot subscribe to another repository's pushes, so poll hourly.
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: rebase-fastpotify-plus
  cancel-in-progress: false

env:
  PATCH_BRANCH: fastpotify-plus
  UPSTREAM_REPOSITORY: crmne/fastpotify
  UPSTREAM_BRANCH: main
  CARGO_TERM_COLOR: always
  MERGIRAF_VERSION: "0.19.1"
  MERGIRAF_SHA256: 632ad77f90bf4874e8b89cfe7073bfbd6ad55c7565d2fa9530062b8df683cc30
  STALLED_ISSUE_TITLE: "Rebase of fastpotify-plus onto upstream stalled"

jobs:
  rebase:
    name: Rebase and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the patch branch
        run: |
          set -euo pipefail
          git clone --branch "$PATCH_BRANCH" --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          # Replay recorded conflict resolutions, and present conflicts in
          # the diff3 style that mergiraf and rerere both expect.
          git config rerere.enabled true
          git config rerere.autoUpdate true
          git config merge.conflictStyle diff3

      - name: Restore recorded conflict resolutions
        run: |
          set -euo pipefail
          mkdir -p .git/rr-cache
          if git fetch origin refs/heads/rerere-cache; then
            git archive FETCH_HEAD | tar -x --exclude=README.md -C .git/rr-cache
            echo "Restored $(find .git/rr-cache -name postimage | wc -l) recorded resolution(s)."
          else
            echo "No rerere cache branch yet; continuing without recorded resolutions."
          fi

      - name: Check whether upstream moved
        id: upstream
        run: |
          set -euo pipefail
          git fetch upstream "$UPSTREAM_BRANCH"
          upstream_head="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "$upstream_head" HEAD; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "upstream_head=$upstream_head" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mergiraf
        if: steps.upstream.outputs.moved == 'true'
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/mergiraf.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://codeberg.org/mergiraf/mergiraf/releases/download/v${MERGIRAF_VERSION}/mergiraf_x86_64-unknown-linux-musl.tar.gz"
          echo "${MERGIRAF_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          install -m 0755 "${RUNNER_TEMP}/mergiraf" /usr/local/bin/mergiraf
          git config merge.mergiraf.name mergiraf
          # -t 0 disables mergiraf's wall-clock fallback so a merge is a
          # pure function of its inputs: conflict text is then identical
          # locally and here, which is what rerere matching relies on.
          git config merge.mergiraf.driver 'mergiraf merge --git -t 0 %O %A %B -s %S -x %X -y %Y -p %P -l %L'
          # Repository-local attributes only: the patch branch carries no
          # trace of this, so the fork diff stays free of automation setup.
          cat > .git/info/attributes <<'EOF'
          *.rs merge=mergiraf
          *.toml merge=mergiraf
          *.yml merge=mergiraf
          *.yaml merge=mergiraf
          *.md merge=mergiraf
          *.sh merge=mergiraf
          *.nix merge=mergiraf
          PKGBUILD merge=mergiraf
          .github/workflows/*.lock.yml -merge
          EOF

      - name: Rebase onto upstream
        id: rebase
        if: steps.upstream.outputs.moved == 'true'
        env:
          UPSTREAM_HEAD: ${{ steps.upstream.outputs.upstream_head }}
        run: |
          set -euo pipefail
          old_head="$(git rev-parse HEAD)"
          git rebase "$UPSTREAM_HEAD" || true
          # rerere stages replayed resolutions but the sequencer still
          # pauses, so drive it forward while nothing is left unmerged.
          for _ in $(seq 1 100); do
            [ -d .git/rebase-merge ] || break
            [ -z "$(git diff --name-only --diff-filter=U)" ] || break
            GIT_EDITOR=true git rebase --continue || true
          done
          if [ -d .git/rebase-merge ] || [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "The rebase stopped on a conflict that needs manual resolution." >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "old_head=$old_head" >> "$GITHUB_OUTPUT"

      - name: Record conflict resolutions for next time
        if: steps.upstream.outputs.moved == 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d .git/rr-cache ] || exit 0
          wt="${RUNNER_TEMP}/rr-cache-wt"
          mkdir -p "$wt"
          if git fetch origin refs/heads/rerere-cache; then
            git worktree add --detach "$wt" FETCH_HEAD
          else
            seed="$(echo "Fastpotify+ rerere cache, seeded by run ${GITHUB_RUN_ID}" \
              | git commit-tree "$(git mktree </dev/null)")"
            git worktree add --detach "$wt" "$seed"
          fi
          cp -a .git/rr-cache/. "$wt"/
          rm -f "$wt/MERGE_RR"
          git -C "$wt" add -A
          if git -C "$wt" diff --cached --quiet; then
            echo "No new conflict resolutions to record."
            exit 0
          fi
          git -C "$wt" commit -m "Record conflict resolutions from run ${GITHUB_RUN_ID}"
          gh auth setup-git
          git -C "$wt" push origin "HEAD:refs/heads/rerere-cache"

      - name: Install Rust
        if: steps.rebase.outputs.changed == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install Linux build dependencies
        if: steps.rebase.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Cache Rust build files
        if: steps.rebase.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fastpotify-plus-rebase

      - name: Verify the rebased branch
        if: steps.rebase.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --all-targets --no-default-features

      - name: Update the patch branch
        if: steps.rebase.outputs.changed == 'true'
        env:
          # GITHUB_TOKEN has no workflows permission, so pushes that carry
          # upstream workflow changes need this token instead.
          GH_TOKEN: ${{ secrets.REBASE_PUSH_TOKEN }}
          OLD_HEAD: ${{ steps.rebase.outputs.old_head }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git push \
            --force-with-lease="refs/heads/${PATCH_BRANCH}:${OLD_HEAD}" \
            origin "HEAD:refs/heads/${PATCH_BRANCH}"

      - name: Close the tracking issue after a successful rebase
        if: steps.rebase.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --state open \
            --search "in:title \"${STALLED_ISSUE_TITLE}\"" \
            --json number --jq '.[0].number // empty')" || true
          if [ -n "${issue_number:-}" ]; then
            gh issue close "$issue_number" \
              --comment "Closed automatically: the rebase in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} succeeded."
          fi

      - name: Calculate the package version
        id: package
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$crate_version"
          crate_version="${crate_version/-/}"
          package_version="${crate_version}.r$(git rev-list --count HEAD).$(git rev-parse --short=7 HEAD)"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Publish the package version
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          main_dir="${RUNNER_TEMP}/fork-main"
          package_dir="packaging/arch/fastpotify-plus-git"
          git fetch origin main
          git worktree add --detach "$main_dir" FETCH_HEAD

          current_version="$(sed -n 's/^pkgver=//p' "$main_dir/$package_dir/PKGBUILD")"
          if [[ "$current_version" == "$PACKAGE_VERSION" ]]; then
            exit 0
          fi

          sed -i "s/^pkgver=.*/pkgver=${PACKAGE_VERSION}/;s/^pkgrel=.*/pkgrel=1/" \
            "$main_dir/$package_dir/PKGBUILD"
          sed -i \
            "s/^[[:space:]]*pkgver = .*/\tpkgver = ${PACKAGE_VERSION}/;s/^[[:space:]]*pkgrel = .*/\tpkgrel = 1/" \
            "$main_dir/$package_dir/.SRCINFO"

          git -C "$main_dir" config user.name "github-actions[bot]"
          git -C "$main_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$main_dir" add \
            "$package_dir/PKGBUILD" "$package_dir/.SRCINFO"
          git -C "$main_dir" commit -m "Track Fastpotify+ ${PACKAGE_VERSION}"
          gh auth setup-git
          git -C "$main_dir" push origin HEAD:refs/heads/main

      - name: Open or update the tracking issue on a stalled rebase
        if: failure() && steps.rebase.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/stalled-issue.md"
          {
            echo "The hourly rebase of \`${PATCH_BRANCH}\` onto \`${UPSTREAM_REPOSITORY}@${UPSTREAM_BRANCH}\` stopped on a conflict that mergiraf and the recorded rerere resolutions could not settle."
            echo
            echo "- Failing run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Stuck patch commit: $(git log -1 --oneline REBASE_HEAD 2>/dev/null || echo unknown)"
            echo "- Conflicted files:"
            git diff --name-only --diff-filter=U | sed 's/^/  - /'
            echo
            cat <<'EOF'
          Resolve it locally and record the resolution so future runs replay it. Use the same mergiraf setup as the pipeline so the conflict text matches byte for byte:

          ```
          tarball=$(mktemp)
          curl -fsSL -o "$tarball" \
            https://codeberg.org/mergiraf/mergiraf/releases/download/v0.19.1/mergiraf_x86_64-unknown-linux-musl.tar.gz
          tar -xzf "$tarball" -C /usr/local/bin mergiraf
          git config rerere.enabled true
          git config rerere.autoUpdate true
          git config merge.conflictStyle diff3
          git config merge.mergiraf.name mergiraf
          git config merge.mergiraf.driver 'mergiraf merge --git -t 0 %O %A %B -s %S -x %X -y %Y -p %P -l %L'
          git rebase origin/main
          # resolve the conflicts, then:
          GIT_EDITOR=true git rebase --continue
          git push fork fastpotify-plus --force-with-lease
          ```

          Then publish the recorded resolutions to the cache branch:

          ```
          git fetch fork rerere-cache
          worktree=$(mktemp -d)
          git worktree add "$worktree" FETCH_HEAD
          cp -a .git/rr-cache/. "$worktree"/
          rm -f "$worktree/MERGE_RR"
          git -C "$worktree" add -A
          git -C "$worktree" commit -m "Record resolutions"
          git -C "$worktree" push fork HEAD:rerere-cache
          ```

          This issue closes automatically once a rebase succeeds again.
          EOF
          } > "$body_file"
          issue_number="$(gh issue list --state open \
            --search "in:title \"${STALLED_ISSUE_TITLE}\"" \
            --json number --jq '.[0].number // empty')" || true
          if [ -n "${issue_number:-}" ]; then
            gh issue edit "$issue_number" --body-file "$body_file"
          else
            gh issue create --title "$STALLED_ISSUE_TITLE" --body-file "$body_file"
          fi
